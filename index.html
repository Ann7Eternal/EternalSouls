<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EternalSouls | Sanctuary</title>
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:wght@400;600&display=swap');

        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: #161616;
            --gold: #d4af37;
            --gold-dim: #8a7322;
            --text-main: #cccccc;
            --success: #2e8b57;
            --google-blue: #4285F4;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'EB Garamond', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--gold); text-align: center; font-weight: 400; margin-top: 0; }
        .container { width: 100%; max-width: 500px; }
        
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(212, 175, 55, 0.1); pointer-events: none;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { text-align: center; padding: 15px; background: #0f0f0f; border: 1px solid #222; }
        .stat-value { font-size: 1.8rem; color: var(--gold); font-family: 'Cinzel', serif; margin: 5px 0; }

        .meter-bg { background: #222; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; border: 1px solid #000; }
        .meter-fill { background: linear-gradient(90deg, var(--gold-dim), var(--gold)); height: 100%; width: 0%; transition: width 0.5s ease-out; }

        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a1a; color: var(--gold); border: 1px solid #444; font-family: 'EB Garamond', serif; font-size: 1rem; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); font-family: 'Cinzel', serif; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        button:hover { background: rgba(212, 175, 55, 0.1); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        button:disabled { border-color: #444; color: #666; cursor: not-allowed; background: none; box-shadow: none; }

        .btn-rest { border-color: var(--success); color: var(--success); margin-top: 30px; }
        .btn-google { border-color: var(--google-blue); color: var(--google-blue); display: none; margin-bottom: 20px; }

        /* Checklist Styles */
        .exercise-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding: 10px; background: #0f0f0f; border: 1px solid #222; border-radius: 4px; }
        .exercise-item input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--gold); flex-shrink: 0; }
        .exercise-details { display: flex; flex-direction: column; }
        .exercise-name { font-weight: bold; color: var(--gold); font-size: 1.1rem; }
        .exercise-sets { font-size: 0.9rem; color: #888; margin-top: 3px; }
        .strike { text-decoration: line-through; opacity: 0.5; }

        #message-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 1px solid var(--gold); padding: 30px; text-align: center; z-index: 1000; display: none; font-family: 'Cinzel', serif; color: var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); width: 80%; max-width: 400px; }
        .hidden { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1>EternalSouls</h1>

        <!-- Visible Google Login Button -->
        <button id="btn-login" class="btn-google" onclick="signInWithGoogle()">
            Link Google Account (Cloud Save)
        </button>
        
        <div class="stats-grid">
            <div class="stat-box"><div style="font-size: 0.9rem; letter-spacing: 1px;">LEVEL</div><div class="stat-value" id="ui-level">1</div></div>
            <div class="stat-box"><div style="font-size: 0.9rem; letter-spacing: 1px;">STREAK</div><div class="stat-value" id="ui-streak">0</div></div>
        </div>

        <div class="panel">
            <h2>The Boss Meter</h2>
            <p style="text-align: center; margin: 0; font-size: 0.9rem;">Weight: <span id="ui-weight">52</span>kg / 65kg</p>
            <div class="meter-bg"><div class="meter-fill" id="weight-bar"></div></div>
        </div>

        <div class="panel">
            <h2>Estus Flasks</h2>
            <p>Hydration: 4 Liters Required</p>
            <div class="meter-bg"><div class="meter-fill" id="water-bar" style="background: linear-gradient(90deg, #1e90ff, #00bfff);"></div></div>
            <button id="btn-water" onclick="drinkEstus()">Drink Estus (+1L)</button>
        </div>

        <div class="panel">
            <h2>Absorb Runes</h2>
            <p>Calories: <span id="ui-calories">0</span> / 2700 Kcal</p>
            <div class="meter-bg"><div class="meter-fill" id="calorie-bar"></div></div>
            <select id="meal-selector" onchange="toggleCustomMeal()">
                <option value="0">Select Consumed Item...</option>
                <option value="400">Breakfast Shake (400 Kcal)</option>
                <option value="800">₹90 Thali (800 Kcal)</option>
                <option value="350">Cafe Snack (350 Kcal)</option>
                <option value="custom">Custom Cheat Meal / Other...</option>
            </select>
            <div id="custom-meal-div" class="hidden">
                <input type="text" id="custom-meal-name" placeholder="Name of item...">
                <input type="number" id="custom-meal-cal" placeholder="Calories...">
            </div>
            <button onclick="absorbRunes()">Absorb</button>
        </div>

        <div class="panel">
            <h2>Combat Log</h2>
            <h3 id="workout-day-title" style="color: var(--text-main); font-size: 1.2rem; margin-bottom: 15px;">Day 1: Back & Biceps</h3>
            <div id="workout-list"></div>
            <button id="btn-workout" onclick="completeWorkout()">Mark Combat Victorious</button>
        </div>

        <button class="btn-rest" onclick="restAtBonfire()">REST AT BONFIRE (End Day)</button>
        <button onclick="requestNotificationPermission()" style="margin-top: 15px; border-color: #555; color: #888;">🔔 Summon Daily Reminders (9 PM)</button>
    </div>

    <div id="message-overlay">
        <h2 id="msg-title" style="margin-top:0;"></h2>
        <p id="msg-body"></p>
        <button onclick="closeMessage()">Acknowledge</button>
    </div>

    <script>
        // Project Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB2Bf8B1S0ITw_21uYQtWKUVY-VrFL6P3k",
            authDomain: "eternalsouls.firebaseapp.com",
            projectId: "eternalsouls",
            storageBucket: "eternalsouls.firebasestorage.app",
            messagingSenderId: "884926707986",
            appId: "1:884926707986:web:1afee5ea4becacd11f5bcb",
            measurementId: "G-R7WE41SB6C"
        };

        let db = null;
        let userId = null;

        if(firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    userId = user.uid;
                    document.getElementById('btn-login').style.display = 'none';
                    loadCloudData();
                } else {
                    document.getElementById('btn-login').style.display = 'block';
                    loadLocalData();
                }
            });
        }

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    showMessage("Link Successful", "Your soul is tethered to the cloud.");
                })
                .catch((error) => {
                    showMessage("Auth Failed", error.message);
                    console.error(error);
                });
        }

        let state = { level: 1, xp: 0, streak: 0, weight: 52, today: { waterLiters: 0, calories: 0, workoutDone: false, workoutDayIndex: 0 }};

        const workouts = [
            { 
                title: "Day 1: Back & Biceps", 
                exercises: [
                    { name: "Rest-Pause Pull-ups", sets: "3 Sets", reps: "To Failure" },
                    { name: "Chin-ups", sets: "3 Sets", reps: "8-10 Reps" },
                    { name: "Backpack Curls", sets: "4 Sets", reps: "10-12 Reps" },
                    { name: "Dead Hangs", sets: "3 Sets", reps: "60 Seconds" }
                ] 
            },
            { 
                title: "Day 2: Chest, Shoulders, Triceps", 
                exercises: [
                    { name: "Standard Push-ups", sets: "3 Sets", reps: "To Failure" },
                    { name: "Pike Push-ups", sets: "3 Sets", reps: "8-12 Reps" },
                    { name: "Diamond Push-ups", sets: "3 Sets", reps: "10-15 Reps" },
                    { name: "Overhead Press", sets: "4 Sets", reps: "10-12 Reps" }
                ] 
            },
            { 
                title: "Day 3: Lower Body", 
                exercises: [
                    { name: "Backpack Squats", sets: "4 Sets", reps: "12-15 Reps" },
                    { name: "Bulgarian Split Squats", sets: "3 Sets", reps: "10 Reps / Leg" },
                    { name: "Glute Bridges", sets: "3 Sets", reps: "15-20 Reps" },
                    { name: "Calf Raises", sets: "4 Sets", reps: "25 Reps" }
                ] 
            },
            { 
                title: "Day 4: Arms & Core", 
                exercises: [
                    { name: "Close-Grip Chin-ups", sets: "3 Sets", reps: "8-10 Reps" },
                    { name: "Tricep Extensions", sets: "4 Sets", reps: "12-15 Reps" },
                    { name: "Negative Pull-ups", sets: "3 Sets", reps: "5 Reps (Slow descent)" },
                    { name: "Planks", sets: "3 Sets", reps: "60 Seconds" }
                ] 
            },
            { 
                title: "Day 5: Upper Body Power", 
                exercises: [
                    { name: "Weighted Pull-ups", sets: "3 Sets", reps: "5-8 Reps" },
                    { name: "Decline Push-ups", sets: "3 Sets", reps: "10-15 Reps" },
                    { name: "Lateral Raises", sets: "4 Sets", reps: "15-20 Reps" },
                    { name: "Hollow Body Holds", sets: "3 Sets", reps: "45 Seconds" }
                ] 
            },
            { 
                title: "Day 6: Lower Body & Stamina", 
                exercises: [
                    { name: "Jump Squats", sets: "3 Sets", reps: "15 Reps" },
                    { name: "Walking Lunges", sets: "3 Sets", reps: "20 Steps" },
                    { name: "Wall Sits", sets: "3 Sets", reps: "60 Seconds" },
                    { name: "Burpees", sets: "3 Sets", reps: "15 Reps" }
                ] 
            }
        ];

        function updateUI() {
            document.getElementById('ui-level').innerText = state.level;
            document.getElementById('ui-streak').innerText = state.streak;
            document.getElementById('ui-weight').innerText = state.weight;
            document.getElementById('weight-bar').style.width = Math.min(100, Math.max(0, ((state.weight - 52) / (65 - 52)) * 100)) + "%";
            document.getElementById('water-bar').style.width = (state.today.waterLiters / 4) * 100 + "%";
            document.getElementById('ui-calories').innerText = state.today.calories;
            document.getElementById('calorie-bar').style.width = Math.min(100, (state.today.calories / 2700) * 100) + "%";

            const wDay = workouts[state.today.workoutDayIndex];
            document.getElementById('workout-day-title').innerText = wDay.title;
            const wList = document.getElementById('workout-list');
            wList.innerHTML = "";
            
            wDay.exercises.forEach((ex, index) => {
                const isDone = state.today.workoutDone ? 'checked disabled' : '';
                const strikeClass = state.today.workoutDone ? 'strike' : '';
                
                wList.innerHTML += `
                    <div class="exercise-item ${strikeClass}" id="ex-div-${index}">
                        <input type="checkbox" id="ex-check-${index}" ${isDone} onchange="toggleExercise(${index})">
                        <div class="exercise-details">
                            <span class="exercise-name">${ex.name}</span>
                            <span class="exercise-sets">${ex.sets} | ${ex.reps}</span>
                        </div>
                    </div>
                `;
            });

            if(state.today.workoutDone) {
                const btn = document.getElementById('btn-workout');
                btn.innerText = "Combat Conquered";
                btn.disabled = true;
            }
        }

        function toggleExercise(index) {
            const checkbox = document.getElementById(`ex-check-${index}`);
            const div = document.getElementById(`ex-div-${index}`);
            if(checkbox.checked) {
                div.classList.add('strike');
            } else {
                div.classList.remove('strike');
            }
        }

        function drinkEstus() { if(state.today.waterLiters < 4) { state.today.waterLiters += 1; saveData(); updateUI(); } }

        function toggleCustomMeal() {
            document.getElementById('custom-meal-div').classList.toggle('hidden', document.getElementById('meal-selector').value !== 'custom');
        }

        function absorbRunes() {
            const sel = document.getElementById('meal-selector').value;
            let cal = 0;
            if(sel === 'custom') {
                cal = parseInt(document.getElementById('custom-meal-cal').value);
                if(!cal || cal <= 0) return showMessage("Invalid Runes", "Enter a valid calorie amount.");
            } else if(sel !== '0') cal = parseInt(sel);
            else return;
            
            state.today.calories += cal;
            document.getElementById('meal-selector').value = '0';
            toggleCustomMeal();
            saveData();
            updateUI();
        }

        function completeWorkout() { 
            state.today.workoutDone = true; 
            saveData(); 
            updateUI(); 
        }

        function restAtBonfire() {
            const success = (state.today.waterLiters >= 4 && state.today.calories >= 2700 && state.today.workoutDone);
            if(success) {
                state.streak++;
                state.xp += 100 * (state.streak >= 3 ? 1.5 : 1);
                if(state.xp >= state.level * 500) {
                    state.level++; state.xp = 0; showMessage("Level Up", `You are now Level ${state.level}. Vitality restored.`);
                } else showMessage("Bonfire Lit", "A perfect day. Progress secured.");
            } else {
                state.streak = 0; state.xp = Math.max(0, state.xp - 50); showMessage("Hollowed", "You failed to meet the requirements. Streak lost.");
            }
            state.today.waterLiters = 0; state.today.calories = 0; state.today.workoutDone = false;
            state.today.workoutDayIndex = (state.today.workoutDayIndex + 1) % workouts.length;
            saveData(); updateUI();
            setTimeout(() => location.reload(), 3000);
        }

        function saveData() {
            localStorage.setItem('eternalSoulsState', JSON.stringify(state));
            if(db && userId) db.collection('users').doc(userId).set(state);
        }

        function loadLocalData() {
            const saved = localStorage.getItem('eternalSoulsState');
            if(saved) state = JSON.parse(saved);
            updateUI();
        }

        function loadCloudData() {
            db.collection('users').doc(userId).get().then(doc => {
                if(doc.exists) state = doc.data(); else loadLocalData();
                updateUI();
            });
        }

        function showMessage(title, body) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-body').innerText = body;
            document.getElementById('message-overlay').style.display = 'block';
        }
        function closeMessage() { document.getElementById('message-overlay').style.display = 'none'; }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.error('SW Error', err));
            });
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) return showMessage("Denied", "Browser does not support bells.");
            Notification.requestPermission().then(permission => {
                if (permission === "granted") { showMessage("Bells Activated", "Reminders at 9 PM."); scheduleReminders(); }
            });
        }

        function scheduleReminders() {
            const now = new Date();
            let target = new Date(now); target.setHours(21, 0, 0, 0);
            if (now > target) target.setDate(target.getDate() + 1);
            setTimeout(() => {
                if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification("The Bonfire Fades...", { body: "Return to the sanctuary.", icon: "https://cdn-icons-png.flaticon.com/512/725/725064.png" });
                    });
                }
                scheduleReminders();
            }, target.getTime() - now.getTime());
        }

        if ("Notification" in window && Notification.permission === "granted") scheduleReminders();
    </script>
</body>
</html>
